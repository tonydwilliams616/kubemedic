# Healthy worker that holds a small in-memory cache well under its limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
  annotations:
    kubernetes.io/change-cause: "cache size 16MB"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: python:3.12-alpine
          # 'x' * n writes every byte, so the pages are really resident
          # (a bare bytearray(n) can stay lazily unallocated and never OOM).
          command: ["python", "-c"]
          args:
            - |
              import os, time
              mb = int(os.environ["CACHE_MB"])
              # Allocate in 1 MB chunks, writing every byte. Small requests are never refused up
              # front, so the only thing that can stop us is the kernel's memory limit: the crash
              # is then always OOMKilled. (One 200 MB request was sometimes refused by Python
              # itself, which showed up as a plain "Error" and made the scenario flaky.)
              cache = [b"x" * (1024 * 1024) for _ in range(mb)]
              print(f"worker started, cache={mb}MB", flush=True)
              time.sleep(10**9)
          env:
            - name: CACHE_MB
              value: "16"
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 64Mi }
