# Fault: the release moves the probe to /healthz, an endpoint the app does
# not serve. The rollout stalls: new pods never become Ready, old pods keep
# serving, so users see nothing wrong until someone notices the stuck rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
  annotations:
    kubernetes.io/change-cause: "release 3.2.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
