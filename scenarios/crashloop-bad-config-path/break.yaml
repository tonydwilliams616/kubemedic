# Fault: the release renames the config path, but the ConfigMap key was
# never renamed, so the file the app looks for does not exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
  annotations:
    kubernetes.io/change-cause: "release 2.4.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              if [ ! -f "$CONFIG_PATH" ]; then
                echo "FATAL: config file $CONFIG_PATH not found" >&2
                exit 1
              fi
              echo "api started with config $CONFIG_PATH"
              while true; do sleep 3600; done
          env:
            - name: CONFIG_PATH
              value: /etc/app/settings.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/app
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
      volumes:
        - name: config
          configMap:
            name: api-config
