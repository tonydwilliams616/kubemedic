# Fault: a batch job's CPU request was typed in cores instead of millicores
# (64 instead of 64m), so no node can ever fit it.
# No base.yaml: a fresh deploy, nothing to roll back to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  labels:
    app: reports
  annotations:
    kubernetes.io/change-cause: "initial deploy"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reports
  template:
    metadata:
      labels:
        app: reports
    spec:
      containers:
        - name: reports
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests: { cpu: "64", memory: 16Mi }
            limits: { memory: 32Mi }
