# Healthy setup: the orders app reaches its database through Service orders-db, which selects the database pods by label.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-db
  labels:
    app: orders-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-db
  template:
    metadata:
      labels:
        app: orders-db
    spec:
      containers:
        - name: db
          image: nginx:1.27-alpine        # stands in for a database: anything that answers on a port
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: orders-db
spec:
  selector:
    app: orders-db
  ports:
    - name: db
      port: 5432
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    app: orders
  annotations:
    kubernetes.io/change-cause: "release 1.8.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: busybox:1.36
          command: ["sh", "-c"]
          # Checks its database every 5 seconds and exits if it can't reach it, so a fault that
          # appears after startup still shows up as a crash.
          args:
            - |
              while true; do
                if ! wget -q -T 3 -O /dev/null http://orders-db:5432/ 2>/tmp/err; then
                  echo "ERROR: cannot reach database orders-db:5432: $(cat /tmp/err)" >&2
                  exit 1
                fi
                echo "orders: database orders-db:5432 ok"
                sleep 5
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
