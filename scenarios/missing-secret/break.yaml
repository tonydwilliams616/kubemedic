# Fault: a new service is deployed before its database Secret was created.
# No base.yaml: there is no good revision to roll back to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    app: payments
  annotations:
    kubernetes.io/change-cause: "initial deploy"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: busybox:1.36
          command: ["sh", "-c", "echo connecting to db; while true; do sleep 3600; done"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payments-db
                  key: password
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
