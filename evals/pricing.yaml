# Bedrock on-demand prices used to estimate the cost of each eval run (US dollars per 1 million tokens).
#
# Prices change: check https://aws.amazon.com/bedrock/pricing/ before quoting a cost anywhere.
# Checked 2026-10-30 against modelcompare.dev.
# A model missing from this list simply gets no cost metric.
models:
  us.amazon.nova-micro-v1:0:     {input_per_million: 0.035, output_per_million: 0.14}
  us.amazon.nova-lite-v1:0:      {input_per_million: 0.06,  output_per_million: 0.24}
  us.amazon.nova-pro-v1:0:       {input_per_million: 0.80,  output_per_million: 3.20}

  # Self-hosted (Phase 6): billed per GPU-hour, not per token. Cost per diagnosis = time it kept the
  # GPU busy x this price. On-demand g6.xlarge, us-east-1 (checked 2026-11-01); spot was ~$0.47/h and
  # a g5.xlarge is $1.006/h on-demand. The EKS control plane (~$0.10/h) is left out: it is shared
  # by everything on the cluster.
  "openai:Qwen/Qwen3-8B":        {gpu_hour_usd: 0.8048}
