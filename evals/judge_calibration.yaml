# Diagnoses for checking the LLM judge: each is labelled correct or incorrect BY A HUMAN, never by a model.
#
# How to label: read the scenario's answer key (scenarios/<scenario>/expected.yaml, root_cause),
# then ask "does this root cause name the same underlying cause, in any words?"
#   correct    same cause (wording, detail and length don't matter)
#   incorrect  only the symptom, a different cause, a key fact wrong, or something else blamed as the main cause
#   unsure     you can't decide: the item is left out of the scores rather than forced into a guess
# Judge the root_cause line; evidence is only there to show what the model meant.
#
# Labelling is blind on purpose: this file doesn't show how the keyword grader or the judge
# marked each item, so neither can influence the human label.
#
# Two sets: "dev" items were used to design the rubric (j2 came from reviewing them), so
# only "test" items, labelled after the rubric was frozen, measure it fairly.
#
# Items marked "synthetic" were written by hand to test the judge in both directions; the rest
# are real model answers from reports/. Don't tune the judge's rubric to these items: if the
# rubric changes, add new labelled items to check it on.
items:
  - id: d01
    set: dev
    scenario: oom-killed
    source: real, prompt v1 (28 Oct)
    root_cause: "The deployment was updated to use a higher memory limit, causing OOM kills."
    evidence:
      - "The pod 'worker-86f5cc66c5-rmlss' is in a CrashLoopBackOff state with the message 'OOMKilled'."
      - "The rollout history shows a change from 'cache size 16MB' to 'cache size 200MB'."
      - "The current memory limit is set to '64Mi', which is insufficient for the new cache size."
    human_label: incorrect

  - id: d02
    set: dev
    scenario: missing-secret
    source: real, prompt v3
    root_cause: "The secret 'payments-db' does not exist in the namespace."
    evidence:
      - "secret \"payments-db\" not found"
      - "Error from server (BadRequest): container \"payments\" in pod \"payments-66449bf7bd-p52f8\" is waiting to start: CreateContainerConfigError"
    human_label: correct

  - id: d03
    set: dev
    scenario: unschedulable-requests
    source: real, prompt v1 (28 Oct)
    root_cause: "Pods are unable to schedule due to insufficient CPU resources and taints on control-plane nodes."
    evidence:
      - "Pods are in Pending state with reason 'Unschedulable'."
      - "Events indicate 'FailedScheduling' due to 'Insufficient cpu' and 'node(s) had untolerated taint {node-role.kubernetes.io/control-plane: }'."
    human_label: correct

  - id: d04
    set: dev
    scenario: bad-image-tag
    source: real, prompt v2
    root_cause: "The image 'nginx:1.27.99-alpine' does not exist in the image registry, causing the new pods to fail to start."
    evidence:
      - "The pod 'web-6679475cb5-cgmrr' is in 'Pending' state with the message 'Back-off pulling image \"nginx:1.27.99-alpine\"', indicating the image cannot be pulled."
      - "The log from the pod 'web-6679475cb5-cgmrr' states 'trying and failing to pull image'."
    human_label: correct

  - id: d05
    set: dev
    scenario: crashloop-bad-config-path
    source: real, prompt v1 (28 Oct)
    root_cause: "The application is crashing due to a missing configuration file at the specified path."
    evidence:
      - "The pod logs indicate a fatal error due to a missing configuration file at /etc/app/settings.yaml."
      - "The deployment has been continuously restarting, as shown by the 'CrashLoopBackOff' status and numerous 'BackOff' events."
    human_label: correct

  - id: d06
    set: dev
    scenario: failing-readiness-probe
